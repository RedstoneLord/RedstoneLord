name: Refresh foxtrot profile

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foxtrot-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Fetch public GitHub stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/refresh_stats.py
      - name: Commit updated console
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'Refresh foxtrot profile stats'
          git push
